version: 2
updates:
  # uv.lock is consumed by CI and developers only; adopters resolve from the ranges in
  # pyproject.toml. Routine version bumps are therefore noise (limit 0 turns them off) while
  # security updates still arrive, as one pull request per batch of alerts instead of one each.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # Every action is pinned to a commit with a version comment; Dependabot keeps both. One pull
  # request a month for all of them, and one for any advisory (zizmor's known-vulnerable-actions
  # audit fails every pull request until a vulnerable pin moves).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
